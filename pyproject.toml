[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "validation-swaps"
version = "0.2.0"
description = "Finite covariate-correction paths for downstream regression diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = [
    "black>=25.1",
    "flake8>=7.2",
    "isort>=6.0",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.setuptools]
py-modules = ["replicate_final", "covariate_swaps", "replicate_covariates", "replicate_archives"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.pdf,*.png,*.jpg,*.jpeg,*.gif,*.csv,*.tsv,*.json,*.geojson,*.graphml,*.ipynb,*.html,*.svg,*.bib,*.bbl,*.lock,*.parquet,*.rda,*.rds,*.RData,*.dta,*.xlsx,*.xml,*.min.js,*.map,*.log,*.aux"
ignore-words-list = "complier"
